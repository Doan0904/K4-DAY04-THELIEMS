# starter_v0 — tool declarations.
# Improved in v1 for routing guidance, argument conventions,
# missing-information handling, and confirmation boundaries.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Hỏi bổ sung thông tin hoặc xin xác nhận từ người dùng. Dùng response_type='text' khi thiếu mã thiết bị (asset_id) hoặc mã nhân viên (employee_id). Dùng response_type='choice' kèm options khi lựa chọn mơ hồ (ví dụ môi trường không rõ). Dùng response_type='yes_no' để xin xác nhận trước khi thực hiện hành động ghi (như tạo ticket) hoặc khi thông tin ticket thay đổi."
    parameters:
      type: object
      properties:
        question: {type: string, description: "Câu hỏi gửi cho người dùng"}
        response_type: {type: string, enum: [text, yes_no, choice], description: "Kiểu phản hồi mong đợi từ người dùng"}
        options: {type: array, default: [], items: {type: string}, description: "Danh sách các lựa chọn khi response_type là choice"}
      required: [question, response_type]

  - name: search_kb
    description: "Tìm kiếm các bài viết hướng dẫn xử lý sự cố trong Knowledge Base nội bộ của IT Helpdesk."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung hoặc từ khóa cần tìm"}
        category: {type: string, enum: [all, vpn, email, wifi, printing, account, security, hardware, software, meeting_room], default: "all", description: "Nhóm hướng dẫn kỹ thuật"}
        top_k: {type: integer, default: 3, description: "Số lượng kết quả tối đa trả về"}
      required: [query]

  - name: check_service_status
    description: "Kiểm tra trạng thái hoạt động của dịch vụ hệ thống dùng chung (vpn, email, sso, wifi, printing). Chỉ hỗ trợ môi trường production hoặc staging. Không dùng tool này để kiểm tra một thiết bị cá nhân."
    parameters:
      type: object
      properties:
        service: {type: string, enum: [vpn, email, sso, wifi, printing], description: "Tên dịch vụ cần kiểm tra"}
        environment: {type: string, enum: [production, staging], default: "production", description: "Môi trường triển khai (production hoặc staging)"}
      required: [service]

  - name: inspect_device
    description: "Kiểm tra thông tin chi tiết và diagnostic snapshot của một thiết bị cụ thể theo mã tài sản (asset_id như LT-xxx, DT-xxx, MB-xxx). Nếu cần so sánh hoặc kiểm tra nhiều thiết bị, hãy gọi tool này riêng cho từng thiết bị. Nếu kiểm tra sự cố cụ thể (như VPN), hãy truyền tham số check tương ứng."
    parameters:
      type: object
      properties:
        asset_id: {type: string, description: "Mã tài sản của thiết bị (ví dụ: LT-204, DT-031)"}
        check: {type: string, enum: [all, network, vpn, security, hardware, software], default: "all", description: "Nhóm kiểm tra chẩn đoán"}
      required: [asset_id]

  - name: lookup_user
    description: "Tra cứu thông tin người dùng, tài khoản và danh sách thiết bị được cấp phát theo mã nhân viên (employee_id như EMP-xxxx)."
    parameters:
      type: object
      properties:
        employee_id: {type: string, description: "Mã nhân viên cần tra cứu (ví dụ: EMP-1001)"}
      required: [employee_id]

  - name: format_incident_report
    description: "Trình bày và định dạng các kết quả chẩn đoán đã thu thập thành báo cáo sự cố có cấu trúc."
    parameters:
      type: object
      properties:
        findings:
          type: array
          default: []
          description: "Danh sách các kết quả chẩn đoán đã thu thập"
          items:
            type: object
            properties:
              label: {type: string}
              detail: {type: string}
              source: {type: string}
              status: {type: string}
        template: {type: string, enum: [brief, technical, handoff], default: "brief", description: "Mẫu báo cáo"}
        incident_title: {type: string, default: "IT incident", description: "Tiêu đề sự cố"}
      required: [findings, template]

  # ---------------- Optional/advanced tools ----------------
  - name: search_device_info
    description: "Tìm thông tin công khai về một model thiết bị trên web. Chỉ truyền hãng, model và loại thông tin; không truyền asset ID, employee ID hoặc dữ liệu nội bộ."
    parameters:
      type: object
      properties:
        manufacturer: {type: string, description: "Hãng sản xuất công khai, ví dụ Lenovo"}
        model: {type: string, description: "Tên model công khai, ví dụ ThinkPad T14 Gen 4"}
        query_type: {type: string, enum: [specs, drivers, support, compatibility], default: "support", description: "Loại thông tin cần tìm"}
        max_results: {type: integer, default: 3, description: "Số kết quả, tối đa 5"}
      required: [manufacturer, model, query_type]

  - name: policy
    description: "Tìm trong chính sách IT nội bộ của công ty."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tìm kiếm"}
        policy_area: {type: string, enum: [all, access_control, data_privacy, external_tools, incident_response, service_operations, ticketing], default: "all", description: "Nhóm chính sách"}
        top_k: {type: integer, default: 3, description: "Số lượng mục chính sách tối đa"}
      required: [query]

  - name: create_ticket
    description: "Tạo một ticket sự cố mới trong hệ thống. LƯU Ý QUAN TRỌNG: Chỉ được gọi tool này khi người dùng ĐÃ XÁC NHẬN RÕ RÀNG (confirmed=true). Nếu người dùng chưa xác nhận, hoặc nội dung ticket bị thay đổi, PHẢI gọi clarify với response_type='yes_no' trước."
    parameters:
      type: object
      properties:
        summary: {type: string, default: "", description: "Tóm tắt sự cố"}
        priority: {type: string, enum: [low, medium, high, critical], default: "medium", description: "Mức ưu tiên của sự cố"}
        asset_id: {type: string, default: "", description: "Mã tài sản liên quan nếu có"}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận của người dùng (bắt buộc phải là True khi tạo)"}
      required: [summary]
